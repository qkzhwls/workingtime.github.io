<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미발계산기 손입력 데이터 이관</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; margin: 0; padding: 24px; color: #37474f; }
        .wrap { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 22px; }
        h1 { font-size: 19px; margin: 0 0 6px; }
        .sub { font-size: 13px; color: #78909c; line-height: 1.7; margin-bottom: 18px; }
        .box { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
        .row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
        .row:last-child { border-bottom: 0; }
        .row .name { font-weight: 700; min-width: 150px; }
        .row .desc { color: #90a4ae; font-size: 12px; flex: 1; }
        .row .state { font-size: 12px; font-weight: 700; min-width: 120px; text-align: right; }
        button { padding: 10px 18px; border: 0; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .primary { background: #1976d2; color: #fff; }
        .primary:disabled { background: #b0bec5; cursor: not-allowed; }
        .ghost { background: #eceff1; color: #37474f; }
        .warn { background: #fff8e1; border: 1px solid #ffe082; color: #8d6e63; font-size: 12.5px;
                border-radius: 8px; padding: 10px 12px; line-height: 1.7; margin-bottom: 14px; }
        #log { font-size: 12px; color: #546e7a; white-space: pre-wrap; margin-top: 14px; max-height: 260px; overflow: auto; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>🚚 미발계산기 손입력 데이터 이관</h1>
    <p class="sub">
        옛 프로젝트(<b>location-e2ff9</b>)에 있던 <b>손으로 입력한 문서</b>만 새 프로젝트(<b>work-tool-e2943</b>)로 복사합니다.<br>
        상품/재고 데이터는 소스 파일을 다시 업로드하면 채워지므로 복사하지 않습니다.
    </p>

    <div class="warn">
        · <b>한 번만</b> 실행하면 됩니다. 새 프로젝트에 같은 이름의 문서가 있으면 <b>덮어씁니다.</b><br>
        · 실행하려면 이 사이트에 <b>로그인</b>돼 있어야 합니다(업무관리에서 로그인한 상태).<br>
        · 끝나면 이 파일은 지워도 됩니다.
    </div>

    <div class="box" id="list"></div>

    <div style="display:flex; gap:8px;">
        <button class="ghost" id="btn-check">1. 옛 데이터 확인</button>
        <button class="primary" id="btn-copy" disabled>2. 새 프로젝트로 복사</button>
    </div>

    <div id="log"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, legacyFirebaseConfig, initializeFirebase } from './js/china-stock-config.js?v=202610021042';

const COLL = 'ChinaStockGoods';
// 파일 업로드로는 복구되지 않는 문서들. checked = 기본 복사 대상.
const DOCS = [
    { id: 'BARCODE_ALIAS', desc: '스캔 바코드 → 상품코드 수동 별칭', checked: true },
    { id: 'BARCODE_MEMO',  desc: '바코드 메모',                      checked: true },
    { id: 'EDITED_CELLS',  desc: '표에서 직접 고친 칸',              checked: true },
    { id: 'MIBAL_HISTORY', desc: '출고일별 미발수량 이력',           checked: true },
    { id: 'LOCATION_MAP',  desc: '위치 매핑(스캐너가 읽음)',         checked: true },
    { id: 'FORCE_ALLOW',   desc: '강제 허용 목록',                   checked: true },
    { id: 'APP_META',      desc: '앱 메타(버전 등)',                 checked: false },
    { id: 'BARCODE_MAP',   desc: '바코드 자동 맵 — 재고로그 업로드로 다시 만들어짐', checked: false }
];

const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent += m + '\n'; $('log').scrollTop = $('log').scrollHeight; };

// 옛 프로젝트(읽기 전용) · 새 프로젝트(china-stock-config 기준)
const oldDb = getFirestore(initializeApp(legacyFirebaseConfig, 'LegacyChinaStock'));
const { db: newDb, auth } = initializeFirebase();

$('list').innerHTML = DOCS.map(d => `
    <label class="row">
        <input type="checkbox" data-id="${d.id}" ${d.checked ? 'checked' : ''}>
        <span class="name">${d.id}</span>
        <span class="desc">${d.desc}</span>
        <span class="state" id="st-${d.id}">-</span>
    </label>`).join('');

let signedIn = false;
onAuthStateChanged(auth, (u) => {
    signedIn = !!u;
    log(u ? `✅ 로그인 확인: ${u.email || u.uid}` : '⚠️ 로그인되지 않았습니다. 업무관리에서 로그인한 뒤 새로고침하세요.');
});

const found = {};

$('btn-check').addEventListener('click', async () => {
    $('log').textContent = '';
    log(`옛 프로젝트(${legacyFirebaseConfig.projectId}) 확인 중…`);
    for (const d of DOCS) {
        const st = $('st-' + d.id);
        try {
            const snap = await getDoc(doc(oldDb, COLL, d.id));
            if (snap.exists()) {
                const data = snap.data();
                found[d.id] = data;
                const n = data && data.map && typeof data.map === 'object' ? Object.keys(data.map).length : null;
                st.textContent = n != null ? `있음 (${n}건)` : '있음';
                st.style.color = '#2e7d32';
            } else {
                st.textContent = '없음';
                st.style.color = '#b0bec5';
            }
        } catch (e) {
            st.textContent = '읽기 실패';
            st.style.color = '#c62828';
            log(`❌ ${d.id}: ${e.message || e}`);
        }
    }
    log('확인 완료. 복사할 항목을 체크한 뒤 [2. 새 프로젝트로 복사]를 누르세요.');
    $('btn-copy').disabled = false;
});

$('btn-copy').addEventListener('click', async () => {
    if (!signedIn) { alert('먼저 업무관리에서 로그인해 주세요.'); return; }
    const targets = DOCS.filter(d => $('list').querySelector(`[data-id="${d.id}"]`).checked && found[d.id]);
    if (targets.length === 0) { alert('복사할 항목이 없습니다. 먼저 [1. 옛 데이터 확인]을 눌러 주세요.'); return; }
    if (!confirm(`${targets.length}개 문서를 ${firebaseConfig.projectId} 로 복사합니다.\n같은 이름의 문서가 있으면 덮어씁니다. 계속할까요?`)) return;

    $('btn-copy').disabled = true;
    for (const d of targets) {
        try {
            await setDoc(doc(newDb, COLL, d.id), found[d.id]);
            $('st-' + d.id).textContent = '복사 완료';
            $('st-' + d.id).style.color = '#1976d2';
            log(`✅ ${d.id} 복사 완료`);
        } catch (e) {
            log(`❌ ${d.id} 복사 실패: ${e.message || e}`);
        }
    }
    log('끝났습니다. 미발계산기를 열어 값이 남아 있는지 확인하세요.');
    $('btn-copy').disabled = false;
});
</script>
</body>
</html>
