<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>입고 스캐너</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #f4f6f8; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        .tabs { display: flex; gap: 8px; padding: 10px 12px 6px; background: var(--theme, #1976d2); align-items: center; }
        .tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 20px; color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
        .tab.active { background: #fff; color: #222; }
        .btn-gear { background: none; border: none; font-size: 22px; color: #fff; cursor: pointer; padding: 4px 6px; }
        .status-line { background: rgba(0,0,0,0.25); color: #fff; text-align: center; font-size: 12px; font-weight: bold; padding: 4px 0; }

        /* [Ver 3.7] 카메라가 남은 화면 전체를 채움 (스캔 목록은 카메라 위에 오버레이) */
        .scan-wrap { position: relative; background: #000; flex: 1; min-height: 0; overflow: hidden; }
        #reader { width: 100%; height: 100%; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
        .btn-start { position: absolute; inset: 0; margin: auto; width: 220px; height: 64px; background: #1976d2; color: #fff; border: none; border-radius: 12px; font-size: 19px; font-weight: 800; cursor: pointer; z-index: 5; }
        .cam-controls { display: none; position: absolute; right: 8px; top: 8px; z-index: 8; gap: 6px; align-items: center; background: rgba(0,0,0,0.45); border-radius: 24px; padding: 5px 10px; }
        .cam-controls button { background: none; border: none; font-size: 22px; color: #fff; cursor: pointer; padding: 2px 6px; opacity: 0.85; }
        .cam-controls #zoom-label { color: #fff; font-size: 13px; font-weight: bold; min-width: 36px; text-align: center; }

        .loc-banner { padding: 12px 15px; font-size: 17px; font-weight: 800; background: #fff3e0; color: #6d4c41; display: none; }
        .loc-banner.fixed { background: #e8f5e9; color: #1b5e20; }

        /* [Ver 4.1] 위치 모드 세부 작업 선택 (당일 입고분 / 기존재고) */
        .loc-submode { display: none; gap: 6px; padding: 8px 10px 0; background: #f4f6f8; }
        .loc-submode button { flex: 1; padding: 9px 0; border: 2px solid #cfd8dc; border-radius: 8px; background: #fff; color: #607d8b; font-size: 14px; font-weight: 800; cursor: pointer; }
        .loc-submode button.active { border-color: #2e7d32; background: #2e7d32; color: #fff; }

        /* [Ver 3.9] 탭-투-포커스 표시 링 + 수동 촬영 버튼 */
        .focus-ring { position: fixed; width: 74px; height: 74px; margin: -37px 0 0 -37px; border: 3px solid #fff; border-radius: 10px; z-index: 9; pointer-events: none; box-shadow: 0 0 8px rgba(0,0,0,0.5); animation: focuspulse 0.7s ease-out forwards; }
        @keyframes focuspulse { 0% { transform: scale(1.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        .btn-capture { display: none; position: absolute; left: 14px; bottom: 14px; z-index: 8; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; background: rgba(0,0,0,0.45); color: #fff; font-size: 26px; cursor: pointer; }
        .btn-capture:active { background: rgba(255,255,255,0.3); }

        /* [Ver 3.7] 스캔 목록: 카메라 위 반투명 오버레이 (내역 있을 때만 표시) */
        .queue { display: none; position: absolute; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom)); max-height: 45%; overflow-y: auto; padding: 6px 8px; z-index: 7; }
        .qitem { background: rgba(255,255,255,0.93); border: 1px solid #e0e0e0; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .qinfo { flex: 1; min-width: 0; }
        .qcode { font-size: 18px; font-weight: 800; }
        .qsub { font-size: 12px; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qqty { font-size: 17px; font-weight: 800; color: #1976d2; white-space: nowrap; }
        .qdel { background: none; border: none; font-size: 20px; color: #d32f2f; cursor: pointer; padding: 4px; }
        .empty-msg { text-align: center; color: #999; padding: 40px 0; font-size: 14px; }

        .send-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #f4f6f8; border-top: 1px solid #ddd; }
        .btn-send { width: 100%; height: 58px; border: none; border-radius: 12px; background: var(--theme, #1976d2); color: #fff; font-size: 19px; font-weight: 800; cursor: pointer; }
        .btn-send:disabled { background: #b0bec5; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; justify-content: center; align-items: center; padding: 18px; }
        .modal { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 360px; max-height: 85dvh; overflow-y: auto; }
        .m-code { font-size: 26px; font-weight: 900; color: #1976d2; text-align: center; word-break: break-all; }
        .m-loc { font-size: 21px; font-weight: 800; text-align: center; margin-top: 4px; }
        .m-remain { text-align: center; margin: 8px 0; font-size: 15px; }
        .m-remain b { font-size: 34px; color: #d32f2f; }
        .m-btn { width: 100%; height: 58px; margin-top: 8px; border: none; border-radius: 10px; background: #1976d2; color: #fff; font-size: 20px; font-weight: 800; cursor: pointer; }
        .m-btn.outline { background: #fff; color: #1976d2; border: 2px solid #1976d2; }
        .m-btn.gray { background: #eee; color: #555; font-size: 16px; height: 46px; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
        .numpad button { height: 52px; font-size: 20px; font-weight: 800; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; cursor: pointer; }
        .num-display { border: 2px solid #1976d2; border-radius: 8px; padding: 10px; font-size: 30px; font-weight: 900; text-align: right; }
        .qty-sel-label { font-size: 13px; font-weight: 800; color: #555; margin: 12px 0 5px; text-align: left; }
        .qty-sel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .qty-sel button { height: 52px; font-size: 22px; font-weight: 800; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; cursor: pointer; }
        .qty-sel button.sel { background: #1976d2; color: #fff; border-color: #1976d2; }
        .set-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; font-weight: bold; gap: 8px; }
        .set-row input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; }
        .set-row input[type="checkbox"] { width: 22px; height: 22px; }

        #toast { visibility: hidden; position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 200; opacity: 0; transition: 0.3s; max-width: 90%; text-align: center; }
        #toast.show { visibility: visible; opacity: 1; }
        #update-banner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: #e65100; color: #fff; z-index: 300; padding: 12px; text-align: center; font-weight: bold; }
        #update-banner button { margin-left: 10px; padding: 6px 14px; border: none; border-radius: 6px; background: #fff; color: #e65100; font-weight: bold; }
    </style>
</head>
<body>
    <div id="update-banner"></div>

    <div class="tabs" id="tabs">
        <div class="tab active" id="tab-in">📦 입고</div>
        <div class="tab" id="tab-loc">📍 위치</div>
        <button class="btn-gear" id="btn-settings">⚙️</button>
    </div>
    <div class="status-line" id="status-line">-</div>
    <!-- [Ver 8.1] 오프라인 표시 -->
    <div id="offline-bar" style="display:none; background:#c62828; color:#fff; text-align:center; padding:7px; font-weight:800; font-size:13px;">🔴 오프라인 — 스캔은 계속 가능, 인터넷 연결 후 [전송하기] 하세요</div>

    <div class="loc-submode" id="loc-submode">
        <button data-sub="today" class="active">📥 당일 입고분</button>
        <button data-sub="existing">🔄 기존재고</button>
    </div>
    <div class="loc-banner" id="loc-banner">위치를 먼저 스캔하세요</div>

    <!-- [Ver 8.1] 수동입력 토글 버튼 (위치모드) -->
    <div id="loc-manual-row" style="display:none; padding:6px 10px 0; background:#f4f6f8;">
        <button id="btn-manual-toggle" style="width:100%; padding:9px; border:1px dashed #90a4ae; background:#fff; color:#455a64; border-radius:8px; font-weight:800; cursor:pointer;">⌨️ 수동입력</button>
    </div>

    <!-- [Ver 8.0] 위치모드 수동 입력 (스캔이 안 될 때) -->
    <div id="loc-manual" style="display:none; flex-direction:column; gap:6px; padding:8px 10px; background:#f4f6f8;">
        <div style="display:flex; gap:6px;">
            <input id="manual-loc" placeholder="위치 입력 (A1R→A-1-R, 155→비축-155)" autocapitalize="characters" style="flex:1; min-width:0; padding:9px; border:1px solid #cfd8dc; border-radius:8px; font-size:14px;">
            <button id="btn-manual-loc" style="padding:9px 14px; border:none; background:#455a64; color:#fff; border-radius:8px; font-weight:800; white-space:nowrap;">위치설정</button>
        </div>
        <div style="display:flex; gap:6px;">
            <input id="manual-code" placeholder="상품코드 입력 (S 생략 가능: 123456)" inputmode="numeric" pattern="[0-9]*" autocapitalize="characters" style="flex:1; min-width:0; padding:9px; border:1px solid #cfd8dc; border-radius:8px; font-size:14px;">
            <button id="btn-manual-code" style="padding:9px 14px; border:none; background:#2e7d32; color:#fff; border-radius:8px; font-weight:800; white-space:nowrap;">추가</button>
        </div>
    </div>

    <!-- [Ver 8.71] 입고모드 수동입력 토글 (바코드 스캔이 안 될 때) -->
    <div id="in-manual-row" style="display:none; padding:6px 10px 0; background:#f4f6f8;">
        <button id="btn-in-manual-toggle" style="width:100%; padding:9px; border:1px dashed #90a4ae; background:#fff; color:#455a64; border-radius:8px; font-weight:800; cursor:pointer;">⌨️ 수동입력</button>
    </div>
    <div id="in-manual" style="display:none; padding:8px 10px; background:#f4f6f8;">
        <div style="display:flex; gap:6px;">
            <input id="in-manual-code" placeholder="상품코드/바코드 (S 생략 가능: 123456)" inputmode="numeric" pattern="[0-9]*" autocapitalize="characters" autocomplete="off" style="flex:1; min-width:0; padding:9px; border:1px solid #cfd8dc; border-radius:8px; font-size:14px;">
            <button id="btn-in-manual-code" style="padding:9px 14px; border:none; background:#1976d2; color:#fff; border-radius:8px; font-weight:800; white-space:nowrap;">확인</button>
        </div>
    </div>

    <div class="scan-wrap">
        <div id="reader"></div>
        <button class="btn-start" id="btn-start">📷 스캔 시작</button>
        <div class="cam-controls" id="cam-controls">
            <button id="btn-torch">🔦</button>
            <button id="btn-zoom-out">➖</button>
            <span id="zoom-label">1.0x</span>
            <button id="btn-zoom-in">➕</button>
        </div>
        <button class="btn-capture" id="btn-capture" title="수동 촬영 인식">📷</button>
        <div class="queue" id="queue"></div>
    </div>
    <div id="file-reader" style="display:none;"></div>

    <div class="send-bar"><button class="btn-send" id="btn-send" disabled>전송하기 (0)</button></div>

    <!-- 입고 선택 모달 (수량: 십/일 자리 선택, 일의자리 누르면 자동 확정) -->
    <div class="overlay" id="ov-select"><div class="modal">
        <div class="m-code" id="sel-code"></div>
        <div class="m-loc" id="sel-loc"></div>
        <div id="sel-memo" style="display:none; background:#ffebee; color:#c62828; border:2px solid #ef9a9a; border-radius:8px; padding:9px 11px; margin:9px 0; font-size:16px; font-weight:800; text-align:center; white-space:pre-line; line-height:1.4;"></div>
        <div class="m-remain">미발수량: <b id="sel-remain">0</b></div>
        <div class="num-display" id="num-display" style="margin-top:8px;">0</div>
        <div class="qty-sel-label">십의 자리 (한 자리 수량이면 건너뛰세요)</div>
        <div class="qty-sel" id="qty-tens" style="grid-template-columns: repeat(2, 1fr);"></div>
        <div class="qty-sel-label">일의 자리 (누르면 바로 추가)</div>
        <div class="qty-sel" id="qty-ones"></div>
        <button class="m-btn gray" id="sel-cancel">취소</button>
    </div></div>

    <!-- 알림 모달 -->
    <div class="overlay" id="ov-alert"><div class="modal">
        <div style="font-weight:900; color:#d32f2f; font-size:17px;">알림</div>
        <div id="alert-msg" style="margin:12px 0; font-size:15px; white-space:pre-line;"></div>
        <div style="display:flex; gap:8px;">
            <button class="m-btn" id="alert-ok" style="flex:1;">확인</button>
            <button class="m-btn" id="alert-force" style="flex:1; display:none; background:#e65100;">강제전송</button>
        </div>
    </div></div>

    <!-- 설정 모달 -->
    <div class="overlay" id="ov-set"><div class="modal">
        <div style="font-weight:900; font-size:17px; margin-bottom:6px;">⚙️ 설정</div>
        <div class="set-row"><span>스캔 즉시 수량 입력</span><input type="checkbox" id="set-direct"></div>
        <button class="m-btn" id="set-close">저장 후 닫기</button>
    </div></div>

    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="js/location-map.js?v=8.59"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, writeBatch, increment, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { firebaseConfig } from './js/china-stock-config.js'; // [Ver 9.9] 관리자 공유 config.js와 충돌 방지 — china-stock 전용 설정

        const SCAN_VERSION = '9.9'; // 웹 배포 버전과 함께 올림 (china-stock-version.json의 web)

        // ---------------- 서버 선택 (URL 파라미터 → 저장값 → 기본 config) ----------------
        const params = new URLSearchParams(location.search);
        let serverCfg = null;
        try { serverCfg = JSON.parse(localStorage.getItem('scanServerCfg') || 'null'); } catch (e) {}
        if (params.get('projectId') && params.get('apiKey')) {
            serverCfg = {
                label: params.get('label') || params.get('projectId'),
                projectId: params.get('projectId'), apiKey: params.get('apiKey'),
                appId: params.get('appId') || '', messagingSenderId: params.get('messagingSenderId') || ''
            };
            localStorage.setItem('scanServerCfg', JSON.stringify(serverCfg));
            history.replaceState(null, '', location.pathname);
        }
        const activeCfg = serverCfg
            ? { apiKey: serverCfg.apiKey, projectId: serverCfg.projectId, appId: serverCfg.appId || undefined, messagingSenderId: serverCfg.messagingSenderId || undefined }
            : firebaseConfig;
        const serverLabel = serverCfg ? (serverCfg.label || serverCfg.projectId) : (firebaseConfig.projectId + ' (기본)');
        const app = initializeApp(activeCfg, 'scanApp');
        const db = getFirestore(app);

        // [Ver 5.8] 위치 매핑을 Firebase(LOCATION_MAP)에서 로드 - 하드코딩 대신 (없으면 location-map.js 기본값)
        let locMapOverride = null;
        async function loadLocationMap() {
            try {
                const snap = await getDoc(doc(db, 'ChinaStockGoods', 'LOCATION_MAP'));
                if (snap.exists() && snap.data().map && Object.keys(snap.data().map).length) locMapOverride = snap.data().map;
            } catch (e) {}
        }
        function getLoc(key) { return locMapOverride ? locMapOverride[key] : (typeof barcodeMap !== 'undefined' ? barcodeMap[key] : undefined); }

        // [Ver 8.3] 바코드 ≠ 상품코드 대응: 미발재고로그의 바코드→상품코드 맵을 로드해 변환
        let barcodeToCode = {};
        let barcodeMemo = {}; // [Ver 8.83] 오류바코드 사유 (바코드 → 사유 텍스트)
        let barcodeMapReady = false; // [Ver 8.85] 로딩 완료 여부
        async function loadBarcodeMap(retry = 0) {
            try {
                // [Ver 8.32] 자동맵(미발로그) + 수동 오류바코드매칭(BARCODE_ALIAS) 병합 (수동 우선)
                const [snap, aSnap] = await Promise.all([
                    getDoc(doc(db, 'ChinaStockGoods', 'BARCODE_MAP')),
                    getDoc(doc(db, 'ChinaStockGoods', 'BARCODE_ALIAS'))
                ]);
                const auto = (snap.exists() && snap.data().map) ? snap.data().map : {};
                const alias = (aSnap.exists() && aSnap.data().map) ? aSnap.data().map : {};
                barcodeToCode = {}; barcodeMemo = {};
                for (const b in auto) barcodeToCode[b] = auto[b]; // 자동맵은 문자열
                for (const b in alias) { // [Ver 8.83] 수동맵: 문자열(구버전) 또는 {code, memo}
                    const v = alias[b];
                    const code = (v && typeof v === 'object') ? (v.code || '') : (v || '');
                    if (code) barcodeToCode[b] = code;
                    const memo = (v && typeof v === 'object') ? (v.memo || '') : '';
                    if (memo) barcodeMemo[b] = memo;
                }
                barcodeMapReady = true; // [Ver 8.85] 로딩 성공
            } catch (e) {
                // [Ver 8.85] 오류바코드 목록이 커서 로딩 실패/지연될 수 있음 → 재시도 (자가복구)
                if (retry < 6) setTimeout(() => loadBarcodeMap(retry + 1), 1500 * (retry + 1));
            }
        }
        // [Ver 8.88] 오류 사유를 별도 작은 문서(BARCODE_MEMO)에서 로드 — 큰 오류바코드 목록(315KB, 폰에서 중첩객체 파싱 실패) 의존 제거
        let memoReady = false;
        async function loadBarcodeMemo(retry = 0) {
            try {
                const s = await getDoc(doc(db, 'ChinaStockGoods', 'BARCODE_MEMO'));
                const m = (s.exists() && s.data().map) ? s.data().map : {};
                for (const b in m) { if (m[b]) barcodeMemo[b] = m[b]; } // 작은 문서로 사유 보강(확실히 로드)
                memoReady = true;
            } catch (e) { if (retry < 6) setTimeout(() => loadBarcodeMemo(retry + 1), 1500 * (retry + 1)); }
        }
        function resolveCode(scanned) {
            const k = (scanned || '').toString().trim().toUpperCase();
            return barcodeToCode[k] || k; // 바코드로 등록된 값이면 상품코드로, 아니면 그대로
        }
        function aliasMemo(scanned) { return barcodeMemo[(scanned || '').toString().trim().toUpperCase()] || ''; } // [Ver 8.83] 스캔한 바코드의 오류 사유
        // [Ver 8.15] 위치 데이터 샤드 (웹과 동일한 해시여야 함)
        const NUM_LOC_SHARDS = 8;
        function locShardId(code) { let h = 0; const s = String(code || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return 'LOC_SHARD_' + (h % NUM_LOC_SHARDS); }

        // ---------------- 상태 ----------------
        let mode = localStorage.getItem('scanMode') || 'in';
        let locSubMode = localStorage.getItem('scanLocSub') || 'today'; // [Ver 4.1] 'today'(당일입고분) | 'existing'(기존재고)
        let inboundQueue = JSON.parse(localStorage.getItem('scanInQueue') || '[]');
        let locationQueue = JSON.parse(localStorage.getItem('scanLocQueue') || '[]');
        let fixedLocation = null;
        let directQty = localStorage.getItem('scanDirectQty') === '1';
        let scanner = null, scanning = false, processing = false, sending = false;

        const $ = (id) => document.getElementById(id);
        const saveQueues = () => { localStorage.setItem('scanInQueue', JSON.stringify(inboundQueue)); localStorage.setItem('scanLocQueue', JSON.stringify(locationQueue)); };

        function speak(t) { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 1.1; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
        function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

        // ---------------- 스캐너 ----------------
        async function startScan() {
            if (scanning) return;
            try {
                const formats = [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_13];
                scanner = new Html5Qrcode('reader', {
                    formatsToSupport: formats,
                    verbose: false,
                    // [Ver 3.5] 지원 기기(안드로이드 크롬 등)에서 하드웨어 가속 바코드 감지기 사용 → 네이티브급 인식
                    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                });
                await scanner.start(
                    { facingMode: 'environment' },
                    {
                        fps: 15,
                        // [Ver 3.8] qrbox 제거 → 카메라 화면 전체가 인식 영역 (구역 조준 불필요)
                        disableFlip: true, // 후면 카메라라 반전 스캔 불필요 (속도 향상)
                        // [Ver 3.5] 고해상도 요청 (작은 바코드 인식률 향상)
                        videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                    },
                    onScan, () => {});
                scanning = true;
                $('btn-start').style.display = 'none';
                $('btn-capture').style.display = 'block'; // [Ver 3.9] 수동 촬영 버튼
                speak(''); // iOS 음성 잠금 해제
                setupCamControls(); // [Ver 3.5] 초점/손전등/줌
            } catch (e) { showAlert('카메라를 시작할 수 없습니다.\n(카메라 권한을 허용해주세요)\n' + e); }
        }

        // [Ver 3.5] 카메라 제어: 연속 자동초점 + 손전등/줌 버튼 (지원 기기에서만 표시)
        let camTrack = null, torchOn = false, hasTorch = false, zoomCaps = null, zoomLevel = 1;
        async function setupCamControls() {
            try {
                const video = document.querySelector('#reader video');
                camTrack = (video && video.srcObject) ? video.srcObject.getVideoTracks()[0] : null;
                if (!camTrack || !camTrack.getCapabilities) return;
                const caps = camTrack.getCapabilities();
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    try { await camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
                }
                hasTorch = !!caps.torch;
                zoomCaps = caps.zoom || null;
                if (zoomCaps) zoomLevel = Math.max(1, zoomCaps.min || 1);
                $('btn-torch').style.display = hasTorch ? '' : 'none';
                $('btn-zoom-out').style.display = $('btn-zoom-in').style.display = $('zoom-label').style.display = zoomCaps ? '' : 'none';
                if (hasTorch || zoomCaps) $('cam-controls').style.display = 'flex';
            } catch (e) {}
        }
        async function applyCam() {
            if (!camTrack) return;
            const adv = [];
            if (zoomCaps) adv.push({ zoom: zoomLevel });
            if (hasTorch) adv.push({ torch: torchOn });
            if (adv.length) { try { await camTrack.applyConstraints({ advanced: adv }); } catch (e) {} }
        }

        // [Ver 3.9] 탭-투-포커스: 화면을 탭한 지점에 초점을 강제로 맞춤 (연속 스캔 유지)
        function showFocusRing(clientX, clientY) {
            const r = document.createElement('div');
            r.className = 'focus-ring';
            r.style.left = clientX + 'px'; r.style.top = clientY + 'px';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 750);
        }
        async function focusAt(nx, ny) {
            if (!camTrack || !camTrack.getCapabilities) return;
            try {
                const caps = camTrack.getCapabilities();
                const adv = {};
                if ('pointsOfInterest' in caps) adv.pointsOfInterest = [{ x: nx, y: ny }];
                if (caps.focusMode && caps.focusMode.includes('single-shot')) adv.focusMode = 'single-shot';
                else if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
                if (Object.keys(adv).length) {
                    await camTrack.applyConstraints({ advanced: [adv] });
                    // 잠시 후 연속 초점 복귀 (single-shot로 고정된 초점 풀기)
                    if (adv.focusMode === 'single-shot' && caps.focusMode.includes('continuous')) {
                        setTimeout(() => { try { camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {} }, 2500);
                    }
                }
            } catch (e) {}
        }

        // [Ver 3.9] 수동 촬영 인식: 풀해상도 사진(지원 시) 또는 현재 프레임을 캡처해 디코딩
        let fileScanner = null;
        async function manualCapture() {
            if (!scanning || processing || !camTrack) return;
            toast('📷 촬영 인식 중...');
            let file = null;
            // 1) 풀해상도 사진 (안드로이드 크롬 등 지원 기기)
            try {
                if (window.ImageCapture) {
                    const blob = await new ImageCapture(camTrack).takePhoto();
                    file = new File([blob], 'cap.jpg', { type: blob.type || 'image/jpeg' });
                }
            } catch (e) {}
            // 2) 폴백: 현재 비디오 프레임을 캔버스로 캡처 (아이폰 등)
            if (!file) {
                try {
                    const video = document.querySelector('#reader video');
                    const cv = document.createElement('canvas');
                    cv.width = video.videoWidth; cv.height = video.videoHeight;
                    cv.getContext('2d').drawImage(video, 0, 0);
                    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.95));
                    file = new File([blob], 'cap.jpg', { type: 'image/jpeg' });
                } catch (e) {}
            }
            if (!file) { toast('촬영 실패 (다시 시도)'); return; }
            try {
                if (!fileScanner) fileScanner = new Html5Qrcode('file-reader', { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
                const result = await fileScanner.scanFileV2(file, false);
                if (result && result.decodedText) onScan(result.decodedText);
                else toast('바코드를 못 찾았어요 (다시 시도)');
            } catch (e) { toast('바코드를 못 찾았어요 (다시 시도)'); }
        }
        function pauseScan() { try { scanner.pause(true); } catch (e) {} }
        function resumeScan(delay = 700) { setTimeout(() => { try { scanner.resume(); } catch (e) {} processing = false; }, delay); }

        // [Ver 9.7] 폰 뒤로가기 버튼: 스캔 팝업(수량/알림)이 열려 있으면 페이지 이탈 대신 팝업만 닫기
        let scanModalPushed = false;
        function pushScanModal() { if (!scanModalPushed) { scanModalPushed = true; try { history.pushState({ scanModal: 1 }, ''); } catch (e) {} } }
        function popScanModal() { if (scanModalPushed) { scanModalPushed = false; try { history.back(); } catch (e) {} } }
        window.addEventListener('popstate', () => {
            if (!scanModalPushed) return; // 우리가 넣은 상태가 아니면 관여하지 않음
            scanModalPushed = false;
            let closed = false;
            const sel = $('ov-select'); if (sel && sel.style.display !== 'none') { sel.style.display = 'none'; closed = true; }
            const al = $('ov-alert'); if (al && al.style.display !== 'none') { al.style.display = 'none'; alertForceAction = null; closed = true; }
            if (closed) resumeScan(); // 팝업만 닫고 스캔 재개 (첫 화면으로 안 나감)
        });

        async function onScan(text) {
            if (processing) return;
            processing = true; pauseScan();
            const raw = text.trim();

            // 서버 연결 QR (웹 [서버 연결 QR 출력]과 동일 형식)
            if (raw.startsWith('{') && raw.includes('fb-server')) {
                try { const c = JSON.parse(raw);
                    if (c && c.type === 'fb-server') {
                        localStorage.setItem('scanServerCfg', JSON.stringify(c));
                        speak('서버 연결됨');
                        alert('서버 연결: ' + (c.label || c.projectId) + '\n페이지를 다시 불러옵니다.');
                        location.reload(); return;
                    }
                } catch (e) {}
            }
            if (mode === 'in') await processInbound(raw); else processLocation(raw);
        }

        // [Ver 8.50] 강제전송 허용 상품코드 — 한 사용자가 강제전송하면 FORCE_ALLOW 문서에 기록 → 다른 사용자 스캔 시 미지정 오류 스킵 (실시간 공유)
        const forceAllowSet = new Set();
        function subscribeForceAllow() {
            try {
                onSnapshot(doc(db, 'ChinaStockGoods', 'FORCE_ALLOW'), (snap) => {
                    forceAllowSet.clear();
                    const m = (snap.exists() && snap.data().map) ? snap.data().map : {};
                    Object.keys(m).forEach(c => forceAllowSet.add(c));
                }, () => {});
            } catch (e) {}
        }
        async function registerForceAllow(code) {
            forceAllowSet.add(code); // 로컬 즉시 반영
            try { await setDoc(doc(db, 'ChinaStockGoods', 'FORCE_ALLOW'), { map: { [code]: true }, updatedAt: serverTimestamp() }, { merge: true }); } catch (e) {}
        }

        // ---------------- 입고 모드 ----------------
        async function processInbound(code) {
            if (!barcodeMapReady) { await loadBarcodeMap(); } // [Ver 8.85] 오류바코드 맵 미로딩 시 먼저 로드 → 변환 누락 방지
            if (!memoReady) { await loadBarcodeMemo(); } // [Ver 8.88] 사유(작은 문서) 확실히 로드
            let key = resolveCode(code); // [Ver 8.3] 바코드 → 상품코드 변환
            if (/^[0-9]+$/.test(key)) key = 'S' + key;
            const memoText = aliasMemo(code) || aliasMemo(key); // [Ver 8.89] 원래 스캔값 또는 S붙인 최종코드로 사유 조회 (S 생략 입력 대응)
            // [Ver 8.48] 음수 방지(입고 초과분) / d 없을 때(미등록·DB오류 강제전송)는 빈 값으로 진행
            const buildItem = (d) => ({ code: key, name: (d && d.name) || '', location: (d && d.location) || '미지정', arrivalQty: Math.max(parseInt(d && d.arrivalQty) || 0, 0), mibalQty: Math.max(parseInt(d && d.mibalQty) || 0, 0), aliasMemo: memoText });
            const proceedWith = (d) => showSelect(buildItem(d));
            const forceProceed = (d) => { registerForceAllow(key); proceedWith(d); }; // [Ver 8.51] 강제전송 → 허용목록 등록 후 정상 입고 진행
            const memoPfx = memoText ? ('⚠️ 오류바코드: ' + memoText + '\n\n') : ''; // [Ver 8.84] 경고에도 사유 표시
            if (memoText) { speak('오류 바코드 확인'); try { navigator.vibrate([120, 80, 120]); } catch (e) {} }

            let snap;
            try { snap = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', key)); }
            catch (e) { showAlert(memoPfx + 'DB 조회 오류\n(네트워크 확인)\n(' + key + ')', () => forceProceed(null)); return; } // [Ver 8.51] 모든 오류에 강제전송
            if (!snap.exists()) {
                if (forceAllowSet.has(key)) { proceedWith(null); return; } // [Ver 8.51] 이미 강제전송 허용된 상품 → 오류 없이 진행
                showAlert(memoPfx + '등록되지 않은 상품입니다.\n(' + key + ')', () => forceProceed(null)); // [Ver 8.51] 미등록도 강제전송 가능
                return;
            }
            const d = snap.data();
            if ((!d.location || d.location === '미지정') && !forceAllowSet.has(key)) { // [Ver 8.49] 로케이션 미지정 오류 (단, [Ver 8.50] 강제전송 등록된 상품은 통과)
                showAlert(memoPfx + '⚠️ 로케이션 미지정 상품입니다.\n(' + key + ')\n위치를 먼저 지정한 뒤 입고해주세요.', () => forceProceed(d));
                return;
            }
            proceedWith(d);
        }

        let currentItem = null;
        function showSelect(item) {
            currentItem = item;
            $('sel-code').textContent = item.code;
            $('sel-loc').textContent = item.location;
            $('sel-remain').textContent = item.mibalQty;
            qtyTens = 0;
            $('num-display').textContent = '0';
            document.querySelectorAll('#qty-tens button').forEach(b => b.classList.remove('sel')); // 십의자리 선택 해제(기본=한 자리)
            // [Ver 8.83] 오류바코드 사유 표시 (등록된 경우) — 작업자가 처리 판단 (음성/진동은 processInbound에서 처리)
            const memoEl = $('sel-memo');
            if (memoEl) { if (item.aliasMemo) { memoEl.textContent = '⚠️ 오류바코드: ' + item.aliasMemo; memoEl.style.display = 'block'; } else memoEl.style.display = 'none'; }
            if (!item.aliasMemo && (parseInt(item.mibalQty) || 0) > 0) speak('미발'); // [Ver 8.79] 미발수량 있을 때만 '미발' 음성 (사유 있으면 사유 음성 우선)
            $('ov-select').style.display = 'flex';
            pushScanModal(); // [Ver 9.7] 뒤로가기로 팝업만 닫히게
        }
        function closeSelect() { $('ov-select').style.display = 'none'; popScanModal(); }

        function addInbound(item, qty, dest) {
            inboundQueue.unshift({ barcode: item.code, qty, name: item.name, location: item.location, dest, mibalQty: item.mibalQty || 0, time: new Date().toTimeString().slice(0, 8) });
            saveQueues(); renderQueue(); speak(qty + '개');
        }

        // [Ver 8.69] 스캔 팝업에 십/일 자리 선택 표시 (일의자리 누르면 자동 확정 → 큐 추가)
        let qtyTens = 0;
        function buildQtySelector() {
            const tens = $('qty-tens'), ones = $('qty-ones');
            // 십의 자리: 1, 2 만 (한 자리 수량은 일의자리만 누르면 됨). 같은 버튼 다시 누르면 해제.
            [1, 2].forEach(i => {
                const bt = document.createElement('button'); bt.textContent = i; bt.dataset.d = String(i);
                bt.onclick = () => {
                    const already = qtyTens === i;
                    qtyTens = already ? 0 : i;
                    document.querySelectorAll('#qty-tens button').forEach(x => x.classList.toggle('sel', !already && x === bt));
                    $('num-display').textContent = String(qtyTens * 10);
                };
                tens.appendChild(bt);
            });
            for (let i = 0; i <= 9; i++) {
                const bo = document.createElement('button'); bo.textContent = i; bo.dataset.d = String(i);
                bo.onclick = () => { const qty = qtyTens * 10 + i; $('num-display').textContent = String(qty); if (qty > 0) { closeSelect(); addInbound(currentItem, qty, '직접입력'); resumeScan(); } };
                ones.appendChild(bo);
            }
        }

        // ---------------- 위치 모드 ----------------
        async function processLocation(code) {
            const raw = code.toUpperCase();
            const mapped = getLoc(raw);
            if (mapped) {
                fixedLocation = mapped;
                renderLocBanner(); speak('위치 변경'); resumeScan(); return;
            }
            if (!fixedLocation) { speak('위치를 먼저 찍으세요'); toast('위치 바코드를 먼저 스캔하세요'); resumeScan(); return; }
            const key = resolveCode(raw); // [Ver 8.3] 바코드 → 상품코드 변환
            if (!/^S\d{6}$/.test(key)) { showAlert('형식 오류\n(올바른 상품 바코드가 아닙니다)'); return; }
            // [Ver 4.1→8.1] ScanDB 조회 (오프라인이면 생략 → 스캔은 허용)
            let name = '', exists = false, dbError = false;
            if (navigator.onLine) {
                try { const snap = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', key)); if (snap.exists()) { exists = true; name = snap.data().name || ''; } }
                catch (e) { dbError = true; }
            }
            // 당일 입고분 모드: 온라인일 때만 목록 검증(오스캔 차단), 오프라인이면 생략
            const addLoc = () => { // [Ver 8.56] 위치 큐 추가 (강제추가에서도 재사용)
                locationQueue.unshift({ barcode: key, location: fixedLocation, name, sub: locSubMode, time: new Date().toTimeString().slice(0, 8) });
                saveQueues(); renderQueue(); speak('스캔'); resumeScan();
            };
            if (locSubMode === 'today') {
                if (!navigator.onLine) { toast('⚠️ 오프라인 · 목록 확인 생략'); }
                else if (dbError) { showAlert('DB 조회 오류\n(네트워크 확인)\n(' + key + ')', () => addLoc(), '강제추가'); return; } // [Ver 8.56]
                else if (!exists) { showAlert('당일 입고 목록에 없는 상품입니다.\n(오스캔 여부 확인)\n' + key, () => addLoc(), '강제추가'); return; } // [Ver 8.56] 강제추가로 위치지정 가능
            }
            addLoc();
        }

        // [Ver 8.0] 위치 수동 입력 — 스캔이 안 될 때 위치/상품코드를 직접 입력
        // [Ver 8.71] 입고모드 수동입력: 스캔과 동일하게 onScan으로 넘김 → processInbound → 수량 선택 팝업
        function inManualSubmit() {
            const el = $('in-manual-code'); const v = (el.value || '').trim();
            if (!v) return;
            el.value = '';
            onScan(v.toUpperCase());
        }
        // [Ver 8.73] 위치 직접입력을 위치매핑(LOCATION_MAP) 등록값 형식에 맞춰 정규화
        //  - 구분자 없이 입력해도 등록된 형식대로 조립 (예: A1R → A-1-R, 비축155 → 비축-155)
        //  - 숫자만이면 기본 예약존 '비축-' 부착
        function activeLocMap() { return locMapOverride || (typeof barcodeMap !== 'undefined' ? barcodeMap : {}); }
        function stripLoc(s) { return String(s || '').toUpperCase().replace(/[\s-]/g, ''); }
        // [Ver 8.82] 위치매핑 등록값에 맞춰 정규화 — 등록 안 된 위치면 null(오류). 단 등록데이터가 아직 없으면 잠금 방지용 폴백.
        function normalizeManualLoc(v) {
            v = (v || '').trim();
            if (!v) return null;
            const idx = {}, m = activeLocMap(); let count = 0;
            for (const k in m) { const val = m[k]; if (val) { const sk = stripLoc(val); if (sk && !(sk in idx)) { idx[sk] = val; count++; } } }
            const key = stripLoc(v);
            if (idx[key]) return idx[key];                        // 등록 형식에 매칭 (A1R → A-1-R, 비축155 → 비축-155)
            if (/^\d+$/.test(v) && idx['비축' + key]) return idx['비축' + key]; // 숫자만 → 등록된 비축
            if (count === 0) return /^\d+$/.test(v) ? ('비축-' + v) : v.toUpperCase(); // 등록데이터 없으면 검증 불가 → 폴백(잠금 방지)
            return null;                                          // 등록된 위치가 아님 → 오류
        }
        function manualSetLocation() {
            const el = $('manual-loc'); const raw = (el.value || '').trim();
            if (!raw) return;
            const v = normalizeManualLoc(raw);
            if (!v) { // [Ver 8.82] 등록 안 된 위치 → 오류 안내 후 다시 입력
                showAlert(`'${raw}'는 등록된 위치가 아닙니다.\n위치매핑에 있는 값으로 다시 입력하세요.`);
                el.focus(); el.select();
                return;
            }
            fixedLocation = v; renderLocBanner(); el.value = '';
            speak('위치 설정'); toast('위치 설정: ' + v);
        }
        async function manualAddProduct() {
            const el = $('manual-code'); let key = resolveCode(el.value); // [Ver 8.3] 바코드 → 상품코드 변환
            if (!key) return;
            if (/^\d+$/.test(key)) key = 'S' + key; // [Ver 8.74] S 없이 숫자만 입력해도 자동 부착 (스캔 흐름과 동일)
            if (!fixedLocation) { showAlert('위치를 먼저 설정하세요\n(위 칸에 위치를 입력하거나 위치 바코드를 스캔)'); return; }
            if (!/^S\d{6}$/.test(key)) { showAlert('형식 오류\nS로 시작하는 7자리로 입력하세요 (예: S123456)'); return; }
            let name = '', exists = false, dbError = false;
            if (navigator.onLine) {
                try { const snap = await getDoc(doc(db, 'ChinaStockGoods_ScanDB', key)); if (snap.exists()) { exists = true; name = snap.data().name || ''; } }
                catch (e) { dbError = true; }
            }
            const addLoc = () => { // [Ver 8.56] 위치 큐 추가 (강제추가에서도 재사용)
                locationQueue.unshift({ barcode: key, location: fixedLocation, name, sub: locSubMode, time: new Date().toTimeString().slice(0, 8) });
                saveQueues(); renderQueue(); el.value = ''; el.focus();
                speak('추가'); toast('추가: ' + key);
            };
            if (locSubMode === 'today') {
                if (!navigator.onLine) { toast('⚠️ 오프라인 · 목록 확인 생략'); }
                else if (dbError) { showAlert('DB 조회 오류\n(네트워크 확인)\n(' + key + ')', () => addLoc(), '강제추가'); return; } // [Ver 8.56]
                else if (!exists) { showAlert('당일 입고 목록에 없는 상품입니다.\n' + key, () => addLoc(), '강제추가'); return; } // [Ver 8.56] 강제추가 가능
            }
            addLoc();
        }

        // ---------------- 전송 ----------------
        async function sendInbound() {
            if (!inboundQueue.length || sending) return;
            if (!navigator.onLine) { showAlert('오프라인 상태입니다.\n인터넷 연결 후 [전송하기]를 눌러주세요.\n(스캔 내역은 저장되어 있습니다)'); return; }
            sending = true; updateSendBtn('전송 중...');
            try {
                const CHUNK = 200; // 배치당 400 작업 (한도 500 이내)
                for (let i = 0; i < inboundQueue.length; i += CHUNK) {
                    const batch = writeBatch(db);
                    inboundQueue.slice(i, i + CHUNK).forEach(it => {
                        batch.set(doc(db, 'ChinaStockGoods_ScanDB', it.barcode), { arrivalQty: increment(-it.qty), mibalQty: increment(-it.qty) }, { merge: true }); // [Ver 8.48] 미발수량도 입고분만큼 즉시 차감 (표시는 0에서 클램프) / [Ver 8.51] set-merge: 강제전송된 미등록 상품(ScanDB 문서 없음)도 생성되도록
                        batch.set(doc(collection(db, 'ChinaStockGoods_InboundHistory')), {
                            barcode: it.barcode, qty: it.qty, name: it.name, location: it.location,
                            dest: it.dest, timestamp: serverTimestamp(), worker: 'Scanner_Web'
                        });
                    });
                    await batch.commit();
                }
                // [Ver 8.45] 비축창고: fullauto와 동일 - 스캔 순서대로, 미발 남아있으면 그 스캔 전부 3층, 다 채웠으면 전부 비축(초과분 안 쪼갬)
                try {
                    let cur = {};
                    const s2 = await getDoc(doc(db, 'ChinaStockGoods', 'FLOOR2_STOCK'));
                    if (s2.exists() && s2.data().map) cur = s2.data().map;
                    const st = {}; // code -> {received, mibal, floor2, name}
                    [...inboundQueue].reverse().forEach(it => { // unshift(최신 앞) → 스캔 시간순으로 처리
                        const c = it.barcode;
                        if (!st[c]) { const ex = cur[c] || {}; st[c] = { received: parseInt(ex.received) || 0, mibal: (ex.mibal !== undefined && ex.mibal !== null) ? (parseInt(ex.mibal) || 0) : (parseInt(it.mibalQty) || 0), floor2: parseInt(ex.floor2) || 0, name: it.name || ex.name || '' }; }
                        const s = st[c];
                        if (s.mibal - s.received > 0) { /* 아직 미발 남음 → 이번 스캔 전부 3층 */ } else { s.floor2 += it.qty; /* 미발 다 채움 → 전부 비축 */ }
                        s.received += it.qty;
                    });
                    const f2 = {};
                    Object.keys(st).forEach(c => { f2[c] = { received: st[c].received, mibal: st[c].mibal, floor2: st[c].floor2, name: st[c].name }; });
                    await setDoc(doc(db, 'ChinaStockGoods', 'FLOOR2_STOCK'), { map: f2, updatedAt: serverTimestamp() }, { merge: true });
                } catch (e) {}
                inboundQueue = []; saveQueues(); renderQueue();
                speak('전송 완료'); toast('✅ 입고 처리 완료');
            } catch (e) { showAlert('전송 실패\n(권한 또는 네트워크 오류)'); }
            sending = false; updateSendBtn();
        }

        // [Ver 6.5] 위치 병합: 기존값(콤마 다중) + 새 위치들 → 중복 제거, 새 자리는 끝에 추가
        // [Ver 8.39] 스캐너는 그냥 기존값 뒤에 새 위치 append (맨앞/맨뒤는 웹 다운로드 시 재배치)
        function mergeLocations(existing, additions) {
            const list = [], seen = new Set();
            const push = v => { v = (v || '').toString().trim(); if (v && !seen.has(v)) { seen.add(v); list.push(v); } };
            (existing || '').toString().split(',').forEach(push);
            (additions || []).forEach(push);
            return list.join(',');
        }
        async function sendLocation() {
            if (!locationQueue.length || sending) return;
            if (!navigator.onLine) { showAlert('오프라인 상태입니다.\n인터넷 연결 후 [전송하기]를 눌러주세요.\n(스캔 내역은 저장되어 있습니다)'); return; }
            sending = true; updateSendBtn('전송 중...');
            const items = [...locationQueue];
            // [Ver 6.5] 상품별 최신 위치를 '누적(append)'로 기록 — 한 상품이 여러 자리를 가짐(콤마 구분)
            //   같은 상품을 여러 번 찍으면 스캔 순서대로 이어붙이고, 기존 저장값 뒤에 새 자리를 추가
            let fbOk = false;
            try {
                // 상품별 스캔 위치 모으기 (queue는 최신이 앞 → 시간순으로 뒤집어 순서 보존)
                const byCode = new Map();
                [...items].reverse().forEach(it => {
                    if (!byCode.has(it.barcode)) byCode.set(it.barcode, { sub: it.sub || '', locs: [] });
                    byCode.get(it.barcode).locs.push(it.location);
                });
                const codes = [...byCode.keys()];
                // [Ver 8.15] 위치 데이터는 샤드 문서(LOC_SHARD_i.map). 찍은 상품이 속한 샤드만 읽고 그 샤드에만 씀
                const codesByShard = {};
                codes.forEach(c => { const sid = locShardId(c); (codesByShard[sid] = codesByShard[sid] || []).push(c); });
                const shardMaps = {};
                try {
                    await Promise.all(Object.keys(codesByShard).map(async sid => {
                        const s = await getDoc(doc(db, 'ChinaStockGoods', sid));
                        shardMaps[sid] = (s.exists() && s.data() && s.data().map) ? s.data().map : {};
                    }));
                } catch (e) {
                    // [Ver 8.13] 기존 위치를 못 읽으면 덮어써서 기존 자리 유실 위험 → 전송 중단, 큐 보존
                    throw new Error('READ_FAILED');
                }
                const now = Date.now();
                for (const sid in codesByShard) {
                    const upd = {};
                    codesByShard[sid].forEach(c => {
                        const g = byCode.get(c);
                        const cur = shardMaps[sid][c] || {};
                        const loc = cur.location || '';
                        const base = (cur.base !== undefined ? cur.base : loc);
                        upd[c] = { location: mergeLocations(loc, g.locs), base: base, sub: g.sub, at: now, worker: 'Scanner_Web' };
                    });
                    await setDoc(doc(db, 'ChinaStockGoods', sid), { map: upd, updatedAt: new Date() }, { merge: true });
                }
                fbOk = true;
            } catch (e) { console.error('위치 Firebase 기록 실패:', e); if (e && e.message === 'READ_FAILED') fbOk = 'READ_FAILED'; }
            // [Ver 8.0] Firebase 저장이 실제로 성공했을 때만 큐를 비움 (실패 시 큐 보존 → 재시도)
            if (fbOk === true) {
                locationQueue = []; fixedLocation = null; saveQueues(); renderQueue(); renderLocBanner();
                speak('전송 완료'); toast('✅ 위치 전송 완료');
            } else if (fbOk === 'READ_FAILED') {
                showAlert('⚠️ 기존 위치를 불러오지 못해 전송을 중단했습니다.\n(그대로 저장하면 기존 자리가 지워질 수 있어 막았습니다)\n무료 사용량 한도/네트워크를 확인하고 다시 시도하세요.\n스캔 내역은 그대로 보관됩니다.');
            } else {
                showAlert('전송 실패 — 저장되지 않았습니다.\n큐를 유지하니 다시 [전송하기]를 눌러 재시도하세요.\n(네트워크 또는 무료 사용량 한도 확인)');
            }
            sending = false; updateSendBtn();
        }

        // ---------------- 렌더링 ----------------
        function currentQueue() { return mode === 'in' ? inboundQueue : locationQueue; }

        function renderQueue() {
            const q = currentQueue(); const el = $('queue');
            if (!q.length) { el.style.display = 'none'; el.innerHTML = ''; updateSendBtn(); return; }
            el.style.display = 'block';
            el.innerHTML = q.map((it, i) => {
                // [Ver 4.0] 위치 모드: 당일 입고분은 상품명, ScanDB에 없으면 표시 / [Ver 8.56] 당일입고 강제추가분은 '목록없음'으로 구분
                const label = it.name ? it.name : (mode === 'loc' ? (it.sub === 'today' ? '⚠️목록없음' : '기존재고') : '');
                return `
                <div class="qitem">
                    <div class="qinfo">
                        <div class="qcode">${it.barcode}</div>
                        <div class="qsub">${label ? label + ' · ' : ''}${it.location} · ${it.time}</div>
                    </div>
                    ${mode === 'in' ? `<div class="qqty">${it.qty}개</div>` : ''}
                    <button class="qdel" data-i="${i}">🗑</button>
                </div>`;
            }).join('');
            el.querySelectorAll('.qdel').forEach(b => b.onclick = () => {
                currentQueue().splice(parseInt(b.dataset.i), 1); saveQueues(); renderQueue();
            });
            updateSendBtn();
        }

        function updateSendBtn(text) {
            const btn = $('btn-send');
            btn.textContent = text || `전송하기 (${currentQueue().length})`;
            btn.disabled = sending || currentQueue().length === 0;
        }

        function renderLocBanner() {
            const b = $('loc-banner');
            b.style.display = mode === 'loc' ? 'block' : 'none';
            const subTxt = locSubMode === 'today' ? '당일 입고분' : '기존재고';
            if (fixedLocation) { b.textContent = `작업 위치: ${fixedLocation}  (${subTxt})`; b.classList.add('fixed'); }
            else { b.textContent = `위치를 먼저 스캔하세요  (${subTxt})`; b.classList.remove('fixed'); }
        }

        function setLocSubMode(s) { // [Ver 4.1]
            locSubMode = s; localStorage.setItem('scanLocSub', s);
            document.querySelectorAll('#loc-submode button').forEach(btn => btn.classList.toggle('active', btn.dataset.sub === s));
            renderLocBanner();
        }

        function setMode(m) {
            mode = m; localStorage.setItem('scanMode', m);
            $('tab-in').classList.toggle('active', m === 'in');
            $('tab-loc').classList.toggle('active', m === 'loc');
            $('loc-submode').style.display = m === 'loc' ? 'flex' : 'none'; // [Ver 4.1]
            $('loc-manual-row').style.display = m === 'loc' ? 'block' : 'none'; // [Ver 8.1] 수동입력 토글 버튼
            $('loc-manual').style.display = 'none'; // 토글로만 열림 (모드 전환 시 닫음)
            const mt = $('btn-manual-toggle'); if (mt) { mt.textContent = '⌨️ 수동입력'; mt.style.background = '#fff'; }
            $('in-manual-row').style.display = m === 'in' ? 'block' : 'none'; // [Ver 8.71] 입고모드 수동입력 토글
            $('in-manual').style.display = 'none';
            const it = $('btn-in-manual-toggle'); if (it) { it.textContent = '⌨️ 수동입력'; it.style.background = '#fff'; }
            const theme = m === 'in' ? '#1976d2' : '#2e7d32';
            document.querySelector('.tabs').style.background = theme;
            $('btn-send').style.background = '';
            document.body.style.setProperty('--theme', theme);
            renderLocBanner(); renderQueue();
        }

        let alertForceAction = null; // [Ver 8.50] 강제 진행 콜백 (있으면 강제 버튼 노출)
        function showAlert(msg, forceAction, forceLabel) {
            speak('오류');
            try { navigator.vibrate([200, 100, 200]); } catch (e) {} // [Ver 8.50] 오류 시 진동
            $('alert-msg').textContent = msg;
            alertForceAction = forceAction || null;
            const fb = $('alert-force');
            fb.textContent = forceLabel || '강제전송'; // [Ver 8.56] 상황별 버튼 라벨(입고=강제전송 / 위치=강제추가)
            fb.style.display = alertForceAction ? 'block' : 'none';
            $('ov-alert').style.display = 'flex';
            pushScanModal(); // [Ver 9.7] 뒤로가기로 팝업만 닫히게
        }

        // ---------------- 버전 체크 ----------------
        async function checkVersion() {
            try {
                const res = await fetch(new URL('china-stock-version.json', location.href).href + '?_=' + Date.now(), { cache: 'no-store' }); // [Ver 9.8] china-stock 전용 버전파일. [Ver 8.47] ?_=시각으로 CDN 캐시 우회 (no-store만으로는 max-age=600 CDN 캐시 못 뚫음)
                const info = await res.json();
                if (info.web && info.web !== SCAN_VERSION) {
                    const b = $('update-banner');
                    if (b.style.display !== 'block') {
                        b.innerHTML = `🔄 새 버전(Ver ${info.web}) 배포됨 `;
                        const btn = document.createElement('button');
                        btn.textContent = '지금 새로고침'; btn.onclick = () => location.reload();
                        b.appendChild(btn); b.style.display = 'block';
                    }
                }
            } catch (e) {}
        }

        // ---------------- 이벤트 바인딩 ----------------
        $('btn-start').onclick = startScan;
        // [Ver 3.5] 손전등/줌
        $('btn-torch').onclick = () => { torchOn = !torchOn; $('btn-torch').style.opacity = torchOn ? '1' : '0.5'; applyCam(); };
        $('btn-zoom-in').onclick = () => {
            if (!zoomCaps) return;
            zoomLevel = Math.min((zoomCaps.max || 4), +(zoomLevel + (zoomCaps.step || 0.5)).toFixed(1));
            $('zoom-label').textContent = zoomLevel.toFixed(1) + 'x'; applyCam();
        };
        $('btn-zoom-out').onclick = () => {
            if (!zoomCaps) return;
            zoomLevel = Math.max((zoomCaps.min || 1), +(zoomLevel - (zoomCaps.step || 0.5)).toFixed(1));
            $('zoom-label').textContent = zoomLevel.toFixed(1) + 'x'; applyCam();
        };
        // [Ver 3.9] 수동 촬영 버튼 + 화면 탭 → 초점
        $('btn-capture').onclick = (e) => { e.stopPropagation(); manualCapture(); };
        // [Ver 8.1] 수동입력 토글
        $('btn-manual-toggle').onclick = () => {
            const open = $('loc-manual').style.display !== 'flex';
            $('loc-manual').style.display = open ? 'flex' : 'none';
            $('btn-manual-toggle').textContent = open ? '⌨️ 수동입력 닫기' : '⌨️ 수동입력';
            $('btn-manual-toggle').style.background = open ? '#eceff1' : '#fff';
            if (open) $('manual-loc').focus();
        };
        // [Ver 8.0] 위치모드 수동 입력 바인딩 (버튼 + Enter)
        $('btn-manual-loc').onclick = manualSetLocation;
        $('manual-loc').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); manualSetLocation(); } });
        $('btn-manual-code').onclick = manualAddProduct;
        $('manual-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); manualAddProduct(); } });
        // [Ver 8.71] 입고모드 수동입력
        $('btn-in-manual-toggle').onclick = () => {
            const open = $('in-manual').style.display !== 'block';
            $('in-manual').style.display = open ? 'block' : 'none';
            $('btn-in-manual-toggle').textContent = open ? '⌨️ 수동입력 닫기' : '⌨️ 수동입력';
            $('btn-in-manual-toggle').style.background = open ? '#eceff1' : '#fff';
            if (open) $('in-manual-code').focus();
        };
        $('btn-in-manual-code').onclick = inManualSubmit;
        $('in-manual-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); inManualSubmit(); } });
        // [Ver 8.1] 오프라인 감지 표시
        function updateNet() { const b = $('offline-bar'); if (b) b.style.display = navigator.onLine ? 'none' : 'block'; }
        window.addEventListener('online', updateNet);
        window.addEventListener('offline', updateNet);
        updateNet();
        $('reader').addEventListener('click', (e) => {
            if (!scanning) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const nx = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            const ny = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
            showFocusRing(e.clientX, e.clientY);
            focusAt(nx, ny);
        });
        $('tab-in').onclick = () => setMode('in');
        $('tab-loc').onclick = () => setMode('loc');
        // [Ver 4.1] 위치 세부 작업 선택
        document.querySelectorAll('#loc-submode button').forEach(btn => btn.onclick = () => setLocSubMode(btn.dataset.sub));
        $('btn-send').onclick = () => mode === 'in' ? sendInbound() : sendLocation();

        $('sel-cancel').onclick = () => { closeSelect(); resumeScan(); };
        $('alert-ok').onclick = () => { $('ov-alert').style.display = 'none'; alertForceAction = null; popScanModal(); resumeScan(); };
        $('alert-force').onclick = () => { const act = alertForceAction; alertForceAction = null; $('ov-alert').style.display = 'none'; if (act) act(); }; // [Ver 8.50] 강제전송 → 정상 입고 단계로

        $('btn-settings').onclick = () => {
            $('set-direct').checked = directQty;
            $('ov-set').style.display = 'flex';
        };
        $('set-close').onclick = () => {
            directQty = $('set-direct').checked;
            localStorage.setItem('scanDirectQty', directQty ? '1' : '0');
            $('ov-set').style.display = 'none'; toast('💾 설정 저장됨');
        };

        // ---------------- 초기화 ----------------
        loadLocationMap(); // [Ver 5.8] 위치 매핑 로드
        loadBarcodeMap(); // [Ver 8.3] 바코드→상품코드 맵 로드
        loadBarcodeMemo(); // [Ver 8.88] 오류 사유(작은 문서) 로드
        subscribeForceAllow(); // [Ver 8.50] 강제전송 허용목록 실시간 구독
        buildQtySelector();
        $('status-line').textContent = `v${SCAN_VERSION} · 서버: ${serverLabel}`;
        setLocSubMode(locSubMode); // [Ver 4.1] 저장된 세부 작업 복원
        setMode(mode);
        checkVersion();
        window.addEventListener('focus', checkVersion);
        setInterval(checkVersion, 10 * 60 * 1000);
    </script>
</body>
</html>
